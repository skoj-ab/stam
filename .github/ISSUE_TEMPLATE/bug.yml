name: Bug report
description: Report behavior that seems wrong
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Stam version or commit
