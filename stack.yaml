version: "3.8"

services:
  stam:
    image: ghcr.io/skoj-ab/stam:${STAM_VERSION:-edge}
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_PATH: /data/stam.sqlite
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID is required}
    volumes:
      - stam-data:/data
    networks:
      - stam-proxy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'const response = await fetch("http://127.0.0.1:3100/api/health"); process.exit(response.ok ? 0 : 1)'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.stam-data==true
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: pause

networks:
  stam-proxy:
    external: true

volumes:
  stam-data:
    external: true
