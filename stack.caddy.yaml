version: "3.8"

services:
  stam:
    image: ghcr.io/skoj-ab/stam:${STAM_VERSION:-edge}
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_PATH: /data/stam.sqlite
      AUTH_SECRET_FILE: /run/secrets/stam_auth_secret
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID is required}
    secrets:
      - stam_auth_secret
    volumes:
      - stam-data:/data
    networks:
      - stam-internal
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'const response = await fetch("http://127.0.0.1:3100/api/health"); process.exit(response.ok ? 0 : 1)'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.stam-data==true
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: pause

  caddy:
    image: caddy:2.10.2-alpine
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      - --to
      - stam:3100
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: udp
        mode: ingress
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - stam-internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.stam-data==true
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: pause

networks:
  stam-internal:
    driver: overlay

secrets:
  stam_auth_secret:
    external: true

volumes:
  stam-data:
    external: true
  caddy-data:
    external: true
  caddy-config:
    external: true
